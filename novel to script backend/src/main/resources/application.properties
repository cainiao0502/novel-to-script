spring.application.name=novel-to-script-backend
server.port=8080

# ======= MySQL =======
# 如需切换实例，直接改下面这行
spring.datasource.url=jdbc:mysql://localhost:3306/novel_to_script?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted

# ======= Redis =======
# 如需切换实例，直接改下面这行
spring.data.redis.host=localhost
spring.data.redis.port=6379
#spring.data.redis.password=
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ======= Sa-Token 鉴权 =======
sa-token.token-name=Authorization
sa-token.timeout=2592000
sa-token.active-timeout=-1
sa-token.is-concurrent=true
sa-token.is-share=true
sa-token.token-style=uuid
sa-token.is-log=true

# ======= 行为验证码（tianai-captcha） =======
captcha.prefix=captcha
captcha.expire.default=120000
captcha.expire.WORD_IMAGE_CLICK=120000
captcha.secondary.enabled=true
captcha.secondary.expire=120000
captcha.secondary.keyPrefix=captcha:secondary
captcha.init-default-resource=true
captcha.local-cache-enabled=true
captcha.local-cache-size=20

# ======= LLM（OpenAI 兼容） =======
# 三个值都从环境变量读取，配置方式：把根目录 .env 里的 APP_LLM_* 加载到环境变量后启动
# 留空时会用默认值（key 为空时生成会 502，但服务可正常启动）
app.llm.base-url=${APP_LLM_BASE_URL:https://api.openai.com/v1}
app.llm.api-key=${APP_LLM_API_KEY:}
app.llm.model=${APP_LLM_MODEL:gpt-4o-mini}
app.llm.timeout-seconds=300
app.llm.max-concurrent=3

# ======= MinerU PDF 解析 =======
app.mineru.base-url=${MINERU_API_BASE_URL:https://mineru.net}
app.mineru.api-token=${MINERU_API_TOKEN:}

# ======= 接口限流（滑动窗口） =======
app.rate-limit.enabled=true
app.rate-limit.max-requests=10
app.rate-limit.window-seconds=60

# File upload
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.nailinai.noveltoscriptbackend=DEBUG
logging.level.org.springframework.web.reactive.function.client=INFO
