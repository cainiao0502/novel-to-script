spring.application.name=novel-to-script-backend
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://${APP_DB_HOST:localhost}:${APP_DB_PORT:3306}/${APP_DB_NAME:novel_to_script}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=${APP_DB_USER:root}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted

# Redis
spring.data.redis.host=${APP_REDIS_HOST:localhost}
spring.data.redis.port=${APP_REDIS_PORT:6379}
spring.data.redis.password=${APP_REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms

# LLM (OpenAI compatible)
app.llm.base-url=${APP_LLM_BASE_URL:https://api.openai.com/v1}
app.llm.api-key=${APP_LLM_API_KEY:}
app.llm.model=${APP_LLM_MODEL:gpt-4o-mini}
app.llm.timeout-seconds=120
app.llm.max-concurrent=3

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.nailinai.noveltoscriptbackend=DEBUG
logging.level.org.springframework.web.reactive.function.client=INFO
